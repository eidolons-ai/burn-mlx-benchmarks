[package]
name = "qwen-handcoded"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "qwen-handcoded"
path = "src/main.rs"

[features]
default = []
wgpu = ["qwen3-burn/wgpu", "burn/wgpu"]
metal = ["qwen3-burn/metal", "burn/metal"]
mlx = ["qwen3-burn/mlx", "dep:burn-mlx"]
# Pure-Rust CPU backend (new in burn 0.21, replaces ndarray) with Apple AMX
# GEMM acceleration enabled.
flex = ["burn/flex", "burn/apple-amx"]

[dependencies]
qwen3-burn = { git = "https://github.com/eidolons-ai/qwen3-burn.git", branch = "burn-0-21", default-features = false }
burn = { version = "0.21.0", default-features = false, features = ["std"] }
burn-mlx = { git = "https://github.com/eidolons-ai/burn-mlx.git", branch = "burn-0-21", optional = true }
bench-common = { path = "../bench-common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
half = { version = "2.4", features = ["serde"] }
